name: Build APK

# Builds an installable APK automatically on every push, manually from the
# Actions tab, or when you comment "/build" on any issue.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.comment.body, '/build') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK (optimised)
        continue-on-error: true
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AuraChat-debug-${{ github.run_number }}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/AuraChat-release-${{ github.run_number }}.apk"
          fi
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraChat-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Aura Chat build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}. Download the APK below and install it on your Android phone." \
            --target "${{ github.sha }}"
          echo "url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Reply on issue
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "APK is ready: ${{ steps.release.outputs.url }}"
